name: v74 content and isolated server acceptance
on:
  pull_request:
    paths:
      - "src/content/questions/**"
      - "src/domain/game/**"
      - "src/storage/schema.ts"
      - "scripts/*bank*"
      - "scripts/*content*"
      - "supabase/migrations/*canonical_bank_v74.sql"
      - "supabase/tests/canonical_bank_v74.sql"
      - ".github/workflows/content-v74.yml"
permissions:
  contents: read
concurrency:
  group: v74-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  isolated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec tsx scripts/build-bank-v74.ts --check
      - run: pnpm exec tsx --test tests/content-expansion-baseline.test.ts tests/content-expansion-integrity.test.ts tests/v74-integration.test.ts tests/canonical-online-bank.test.ts tests/canonical-questions.test.ts tests/broad-categories-history.test.ts
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.121.0
      - name: Initialize isolated fixture with unused host ports
        run: |
          python3 - <<'PY'
          import os
          import re
          import socket
          from pathlib import Path
          p = Path("supabase/config.toml")
          s = p.read_text()
          setting = "[storage]\nenabled = false"
          assert s.count(setting) == 1
          s = s.replace(setting, "[storage]\nenabled = true", 1)
          # CI-only identity and ports; never change another project's containers
          # or rely on the developer machine's fixed Supabase ports being free.
          project = f"anla-v74-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          s, count = re.subn(r'^project_id = "[^"]+"', f'project_id = "{project}"', s, count=1, flags=re.M)
          assert count == 1
          reserved = []
          def unused_port(match):
              sock = socket.socket()
              sock.bind(("0.0.0.0", 0))
              reserved.append(sock)
              return match[1] + str(sock.getsockname()[1])
          s = re.sub(r'^(\s*(?:port|shadow_port|inspector_port)\s*=\s*)\d+', unused_port, s, flags=re.M)
          p.write_text(s)
          for sock in reserved:
              sock.close()
          PY
      - name: Start local-only fixture without hosted credentials
        run: supabase start --exclude studio,imgproxy,postgres-meta,logflare,vector,supavisor,edge-runtime
      - name: Validate v74, frozen banks, private keys, ACL and scoring
        run: pnpm exec tsx scripts/check-canonical-bank-local.ts "$RUNNER_TEMP/v74-private"
      - name: Stop isolated fixture
        if: always()
        run: supabase stop --no-backup
