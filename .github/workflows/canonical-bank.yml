name: Canonical bank offline and server acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main, integration/mobile-game-ui-20261026]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  content-check:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm questions:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Offline web bundle with synthetic connection values
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_CONTENT_CHANNEL: production
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_only
        run: pnpm exec expo export --platform web --max-workers 2
      - name: Real Chromium solo acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-node" --no-save playwright@1.56.1
          "$RUNNER_TEMP/visual-node/node_modules/.bin/playwright" install --with-deps chromium
          pnpm preview > /tmp/v72-preview.log 2>&1 &
          sleep 3
          SETTINGS_ORIGIN=http://127.0.0.1:8117 node scripts/canonical-bank-smoke.mjs
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Ephemeral local Supabase; no hosted credentials
        run: supabase start --exclude studio,storage-api,imgproxy,postgres-meta,logflare,vector,supavisor,edge-runtime
      - name: Canonical staging, historic games, ACL and server scoring
        run: pnpm exec tsx scripts/check-canonical-bank-local.ts "$RUNNER_TEMP/v72-private"
      - name: Stop ephemeral fixture
        if: always()
        run: supabase stop --no-backup
