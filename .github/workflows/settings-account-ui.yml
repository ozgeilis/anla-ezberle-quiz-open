name: Ayarlar ve hesap arayuzu
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src/features/settings/**"
      - "src/features/profile/**"
      - "src/features/online/**"
      - "src/features/home/**"
      - "src/components/**"
      - "assets/images/category-gems/**"
      - "src/app/**"
      - "scripts/settings-account-smoke.mjs"
      - "scripts/mobile-game-ui-smoke.mjs"
      - "scripts/fixtures/account-http.mjs"
      - ".github/workflows/settings-account-ui.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  settings-account-smoke:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Export isolated account fixture build
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_real
        run: pnpm export:web
      - name: Install real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-node" --no-save playwright@1.56.1
          "$RUNNER_TEMP/visual-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise settings and account flows
        run: |
          pnpm preview > /tmp/settings-preview.log 2>&1 &
          sleep 3
          node scripts/settings-account-smoke.mjs
          node scripts/mobile-game-ui-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: settings-account-ui
          path: |
            artifacts/settings-account-ui/
            artifacts/mobile-game-ui/
          retention-days: 1
          if-no-files-found: ignore
