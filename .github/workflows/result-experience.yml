name: Premium result and category acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main, feat/android-preview-play-readiness]
    paths:
      - "src/features/results/**"
      - "src/features/quiz/ResultsScreen.tsx"
      - "src/features/categories/**"
      - "src/branding/StudioIntro.tsx"
      - "src/app/_layout.tsx"
      - "assets/images/result-rewards/**"
      - "assets/images/category-approved/**"
      - "scripts/*smoke.mjs"
      - "tests/result-presentation.test.ts"
      - ".github/workflows/result-experience.yml"
permissions:
  contents: read
concurrency:
  group: results-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  result-experience:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Export isolated web application
        env:
          EXPO_NO_DOTENV: "1"
        run: pnpm export:web
      - name: Install standard CI browser
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-node" --no-save playwright@1.56.1
          "$RUNNER_TEMP/visual-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Real rounds, five result tiers, categories and existing navigation/history/theme acceptance
        run: |
          pnpm preview > /tmp/result-preview.log 2>&1 &
          sleep 3
          node scripts/result-experience-smoke.mjs
          node scripts/visual-categories-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: premium-results-category-acceptance
          path: |
            artifacts/result-experience/
            artifacts/unified-categories-ui/
          retention-days: 1
          if-no-files-found: ignore
