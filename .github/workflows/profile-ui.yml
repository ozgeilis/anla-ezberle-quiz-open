name: Profile identity, statistics and navigation acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main, integration/mobile-game-ui-20261026]
    paths:
      - "src/features/profile/**"
      - "src/features/home/**"
      - "src/theme/tokens.ts"
      - "src/features/achievements/**"
      - "src/features/categories/**"
      - "src/components/ui/**"
      - "scripts/profile-*.mjs"
      - "scripts/profile-fixture.ts"
      - "scripts/home-card-fixture.ts"
      - "scripts/home-cards-smoke.mjs"
      - "tests/profile-summary.test.ts"
      - ".github/workflows/profile-ui.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  profile-ui:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Export isolated account fixture build
        env:
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:55431
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture_not_real
        run: pnpm export:web
      - name: Install real browser
        run: |
          npm install --prefix "$RUNNER_TEMP/visual-node" --no-save playwright@1.56.1
          "$RUNNER_TEMP/visual-node/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Exercise profile and back navigation
        run: |
          pnpm preview > /tmp/settings-preview.log 2>&1 &
          sleep 3
          pnpm exec tsx scripts/profile-fixture.ts
          SETTINGS_ORIGIN=http://127.0.0.1:8117 node scripts/profile-ui-smoke.mjs
          pnpm exec tsx scripts/home-card-fixture.ts
          SETTINGS_ORIGIN=http://127.0.0.1:8117 node scripts/home-cards-smoke.mjs
          SETTINGS_ORIGIN=http://127.0.0.1:8117 HOME_BROWSER=webkit HOME_SCREENSHOTS=artifacts/home-cards/webkit node scripts/home-cards-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: profile-ui
          path: |
            artifacts/profile-ui/
            artifacts/home-cards/
          retention-days: 1
          if-no-files-found: ignore
